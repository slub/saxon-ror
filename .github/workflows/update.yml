name: Update Saxon ROR data

# Refreshes the Saxon ROR subset (and the OpenAlex companion layer) from the
# latest Zenodo dump. Polls daily and on manual dispatch, but a preflight check
# resolves the latest Zenodo DOI first: if it matches the DOI already recorded in
# data/meta.json, the run stops before downloading anything -- no dump fetch, no
# OpenAlex sweep, no pull request. Never pushes to the default branch: when the
# data actually changes, it opens a pull request instead.
#
# Secrets used: CURATION_TOKEN (GitHub issue search) and OPENALEX_API_KEY, both
# optional -- see the steps below and the README for what happens without them.

on:
  schedule:
    # 06:00 UTC daily. Most runs no-op at the preflight step; the download and
    # OpenAlex sweep only happen on the day a new dump appears.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mailto:
        description: "Contact e-mail for the OpenAlex polite pool"
        required: false
        default: "openalex@slub-dresden.de"
      force:
        description: "Ignore the freshness check and re-fetch regardless"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Cheap probe: resolve the latest Zenodo DOI and compare it to what we
      # already have. On a match (and unless forced) the job stops here -- no
      # download, no OpenAlex sweep, no PR. This is what makes daily polling free.
      - name: Check for a new ROR release
        id: preflight
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "Force requested -- skipping the freshness check."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(PYTHONPATH=scripts python -c "import ror_lib as R; print(R.zenodo_latest()['doi'])")
          current=$(python -c "import json; print(json.load(open('data/meta.json')).get('ror', {}).get('zenodo_doi', ''))")
          echo "Latest Zenodo DOI:  ${latest:-<none>}"
          echo "Current data DOI:   ${current:-<none>}"
          if [ -n "$current" ] && [ "$latest" = "$current" ]; then
            echo "Already up to date -- nothing to do."
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "New release detected -- proceeding with update."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update ROR subset
        if: steps.preflight.outputs.fresh != 'true'
        run: python scripts/update_ror.py

      # Search only the records this dump touched; curation-seed.yml sweeps the
      # rest weekly.
      - name: Collect changed records
        id: changed
        if: steps.preflight.outputs.fresh != 'true'
        run: |
          set -euo pipefail
          # Added records are still untracked here, so --porcelain is the only
          # view that sees them ("??") alongside modifications (" M").
          # Deletions are dropped -- a retired record has nothing to link.
          suffixes=$(
            git status --porcelain -- data/records \
              | sed -nE '/^.?D/d; s#.*data/records/([0-9a-z]+)\.json$#\1#p' \
              | sort -u | tr '\n' ' '
          )
          echo "Changed records: ${suffixes:-<none>}"
          echo "suffixes=$suffixes" >> "$GITHUB_OUTPUT"

      # continue-on-error on purpose: a link is enrichment, and a search outage
      # must not cost us the data update. The next step makes the miss visible
      # so a broken token cannot rot silently; the weekly reseed retries.
      - name: Link ROR curation requests
        id: curation
        if: steps.preflight.outputs.fresh != 'true' && steps.changed.outputs.suffixes != ''
        timeout-minutes: 60
        continue-on-error: true
        env:
          # The built-in token cannot search ror-community/ror-updates.
          GITHUB_TOKEN: ${{ secrets.CURATION_TOKEN || secrets.GITHUB_TOKEN }}
          # Unquoted below on purpose -- the list has to word-split into
          # separate arguments. Safe: the sed above emits [0-9a-z] suffixes only.
          SUFFIXES: ${{ steps.changed.outputs.suffixes }}
        run: python scripts/update_curation.py --seed --only $SUFFIXES

      # Only when the seed actually failed -- a skipped step reports outcome
      # "skipped", not "failure". The file is picked up by the PR body below,
      # so the warning reaches whoever merges, not just the run log.
      - name: Flag missing curation links
        if: steps.curation.outcome == 'failure'
        env:
          SUFFIXES: ${{ steps.changed.outputs.suffixes }}
        run: |
          set -euo pipefail
          {
            echo "> [!WARNING]"
            echo "> Curation linking failed for this dump (\`$SUFFIXES\`) --"
            echo "> check the *Link ROR curation requests* step, and whether"
            echo "> \`CURATION_TOKEN\` is still valid. The data below is unaffected;"
            echo "> the weekly reseed will retry."
          } > /tmp/curation-warning.md
          cat /tmp/curation-warning.md >> "$GITHUB_STEP_SUMMARY"

      # The key reaches the script through the environment only -- never through
      # the run: source, which would put it in the workflow text and the logs.
      # A missing key warns and continues anonymously rather than costing us the
      # whole ROR refresh; a rejected key is not retried anonymously, so the step
      # fails with it. See the README for the full policy.
      - name: Update OpenAlex companion data
        if: steps.preflight.outputs.fresh != 'true'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -euo pipefail
          # Whitespace-stripped before the emptiness test so this check and the
          # script agree: update_openalex.py strips too, so a secret of blanks
          # would otherwise count as configured here and go anonymous there.
          # Copied into a local first so an unset variable fails the test
          # rather than `set -u`.
          key="${OPENALEX_API_KEY:-}"
          if [ -z "${key//[[:space:]]/}" ]; then
            echo "::warning title=OpenAlex API key missing::Falling back to anonymous access with a lower allowance."
            {
              echo "### ⚠ OpenAlex API key missing"
              echo
              echo "The refresh used anonymous access. Configure the"
              echo "\`OPENALEX_API_KEY\` repository secret for the larger allowance."
            } >> "$GITHUB_STEP_SUMMARY"
            # Blanks must not reach the script as a "configured" key.
            unset OPENALEX_API_KEY
          fi

          python scripts/update_openalex.py \
            --mailto "${{ github.event.inputs.mailto || 'openalex@slub-dresden.de' }}"

      - name: Summarize changes
        id: diff
        if: steps.preflight.outputs.fresh != 'true'
        run: |
          # Stage first: new record files are untracked, and plain `git diff` is
          # blind to untracked files entirely. Diffing --cached from here on is
          # what makes the counts below correct.
          git add -A -- data

          if git diff --cached --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Drives the curation-update label below, so that filtering on it
          # finds every PR that touched a link, not just the reseed's.
          if git diff --cached --quiet -- data/curation.json; then
            curation=false
          else
            curation=true
          fi
          echo "curation=$curation" >> "$GITHUB_OUTPUT"

          # Per-record file adds/removals/modifications for the PR body.
          added=$(git diff --cached --diff-filter=A --name-only -- data/records | wc -l | tr -d ' ')
          removed=$(git diff --cached --diff-filter=D --name-only -- data/records | wc -l | tr -d ' ')
          modified=$(git diff --cached --diff-filter=M --name-only -- data/records | wc -l | tr -d ' ')
          version=$(python -c "import json; print(json.load(open('data/meta.json'))['ror']['dump_version'])")
          count=$(python -c "import json; print(json.load(open('data/meta.json'))['ror']['record_count'])")
          # Real Zenodo creation moment of this dump -- used as the commit's
          # author date so `git log` reads as a true Zenodo timeline.
          created=$(python -c "import json; print(json.load(open('data/meta.json'))['ror']['zenodo_created'])")

          {
            echo "version=$version"
            echo "count=$count"
            echo "added=$added"
            echo "removed=$removed"
            echo "modified=$modified"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"

          {
            echo "Automated refresh from ROR dump **$version** — $count Saxon records."
            echo ""
            echo "| Change | Records |"
            echo "| --- | --- |"
            echo "| Added | $added |"
            echo "| Removed | $removed |"
            echo "| Modified | $modified |"
            echo ""
            if [ "$added" -gt 0 ]; then
              echo "**Added:**"
              git diff --cached --diff-filter=A --name-only -- data/records | sed 's#data/records/#- \`#; s#\.json#\`#'
              echo ""
            fi
            if [ "$removed" -gt 0 ]; then
              echo "**Removed:**"
              git diff --cached --diff-filter=D --name-only -- data/records | sed 's#data/records/#- \`#; s#\.json#\`#'
              echo ""
            fi
            # Links the seed just added, read from the staged diff against
            # HEAD -- no before/after snapshot to keep in sync.
            if [ "$curation" = "true" ]; then
              echo "**Curation links:**"
              python3 - <<'PY'
          import json, subprocess, sys

          # Repo name from the script, so it cannot drift out of the workflows.
          sys.path.insert(0, "scripts")
          from update_curation import CURATION_REPO

          show = subprocess.run(
              ["git", "show", "HEAD:data/curation.json"],
              capture_output=True, text=True,
          )
          # No file at HEAD (first run) just means every link is new.
          before = json.loads(show.stdout) if show.returncode == 0 else {}
          after = json.load(open("data/curation.json"))
          for sfx, nums in sorted(after.items()):
              new = sorted(set(nums) - set(before.get(sfx, [])), reverse=True)
              if new:
                  # "#123" would resolve against *this* repo; owner/repo#123 or
                  # a github.com URL would file a backlink on an issue we do not
                  # own. redirect.github.com is GitHub's documented opt-out.
                  links = ", ".join(
                      f"[#{n}](https://redirect.github.com/{CURATION_REPO}/issues/{n})"
                      for n in new
                  )
                  print(f"- `{sfx}`: {links}")
          PY
              echo ""
            fi
            # `if` rather than `[ -f ] && cat`: a missing file (the normal case)
            # would end this group on a non-zero status and fail the step.
            if [ -f /tmp/curation-warning.md ]; then
              cat /tmp/curation-warning.md
            fi
          } > /tmp/pr-body.md

      # Committed here rather than by an action so the author date can be the
      # dump's Zenodo creation moment. Landing the PR with "Rebase and merge"
      # preserves it on main.
      - name: Open data-update pull request
        if: steps.preflight.outputs.fresh != 'true' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_DATE: ${{ steps.diff.outputs.created }}
          GIT_COMMITTER_DATE: ${{ steps.diff.outputs.created }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="automated/data-update"
          git switch -c "$branch"
          git commit -m "data: update to ROR dump ${{ steps.diff.outputs.version }} (${{ steps.diff.outputs.count }} Saxon records)"
          git push --force origin "$branch"

          # Ensure the tracking labels exist, then open the PR if none is open.
          # curation-update carries curation-seed.yml's colour so the two agree.
          gh label create data-update --color 0e8a16 --force >/dev/null 2>&1 || true
          labels="data-update"
          if [ "${{ steps.diff.outputs.curation }}" = "true" ]; then
            gh label create curation-update --color 5319e7 --force >/dev/null 2>&1 || true
            labels="$labels,curation-update"
          fi

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main --head "$branch" \
              --title "data: update to ROR dump ${{ steps.diff.outputs.version }}" \
              --body-file /tmp/pr-body.md \
              --label "$labels"
          else
            # --add-label, not --label: a re-run that finds a link must not
            # strip labels a previous run (or a human) already put on the PR.
            gh pr edit "$branch" --body-file /tmp/pr-body.md --add-label "$labels"
          fi
