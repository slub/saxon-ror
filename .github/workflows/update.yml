name: Update Saxon ROR data

# Refreshes the Saxon ROR subset (and the OpenAlex companion layer) from the
# latest Zenodo dump. Polls daily and on manual dispatch, but a preflight check
# resolves the latest Zenodo DOI first: if it matches the DOI already recorded in
# data/meta.json, the run stops before downloading anything -- no dump fetch, no
# OpenAlex sweep, no pull request. Never pushes to the default branch: when the
# data actually changes, it opens a pull request instead.
#
# Secrets: the OpenAlex sweep authenticates with the OPENALEX_API_KEY repository
# secret (configured separately by a repository administrator) and identifies
# itself to the polite pool with the mailto address below. Without the secret it
# warns and falls back to anonymous access rather than failing the update.

on:
  schedule:
    # 06:00 UTC daily. Most runs no-op at the preflight step; the download and
    # OpenAlex sweep only happen on the day a new dump appears.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mailto:
        description: "Contact e-mail for the OpenAlex polite pool"
        required: false
        default: "openalex@slub-dresden.de"
      force:
        description: "Ignore the freshness check and re-fetch regardless"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Cheap probe: resolve the latest Zenodo DOI and compare it to what we
      # already have. On a match (and unless forced) the job stops here -- no
      # download, no OpenAlex sweep, no PR. This is what makes daily polling free.
      - name: Check for a new ROR release
        id: preflight
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "Force requested -- skipping the freshness check."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(PYTHONPATH=scripts python -c "import ror_lib as R; print(R.zenodo_latest()['doi'])")
          current=$(python -c "import json; print(json.load(open('data/meta.json')).get('ror', {}).get('zenodo_doi', ''))")
          echo "Latest Zenodo DOI:  ${latest:-<none>}"
          echo "Current data DOI:   ${current:-<none>}"
          if [ -n "$current" ] && [ "$latest" = "$current" ]; then
            echo "Already up to date -- nothing to do."
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "New release detected -- proceeding with update."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update ROR subset
        if: steps.preflight.outputs.fresh != 'true'
        run: python scripts/update_ror.py

      # Only the records this dump actually touched are worth searching: an
      # added record brings its own "add new organization" request, and a
      # modified record is the visible result of an applied modify request
      # (which names its target in the title or the body's "ROR ID:" field, so
      # it links immediately). Everything else -- above all an add whose
      # "Assigned ROR ID" comment lands weeks after the dump -- stays the job
      # of the weekly full reseed in curation-seed.yml.
      - name: Collect changed records
        id: changed
        if: steps.preflight.outputs.fresh != 'true'
        run: |
          set -euo pipefail
          # Added records are still untracked at this point, so --porcelain is
          # the only view that sees them ("??") alongside modifications (" M").
          # Deletions are dropped -- a record ROR retired has nothing to link.
          suffixes=$(
            git status --porcelain -- data/records \
              | sed -nE '/^.?D/d; s#.*data/records/([0-9a-z]+)\.json$#\1#p' \
              | sort -u | tr '\n' ' '
          )
          echo "Changed records: ${suffixes:-<none>}"
          echo "suffixes=$suffixes" >> "$GITHUB_OUTPUT"

      # continue-on-error on purpose: a curation link is enrichment, and it is
      # best-effort by construction anyway (an add request only becomes linkable
      # once its assignment comment appears, which can trail the dump by weeks). A
      # search outage must not cost us the data update itself -- the weekly
      # reseed in curation-seed.yml picks up whatever this run missed. The step
      # below makes the miss visible so a broken CURATION_TOKEN cannot rot
      # silently until someone notices unlinked records on the site.
      - name: Link ROR curation requests
        id: curation
        if: steps.preflight.outputs.fresh != 'true' && steps.changed.outputs.suffixes != ''
        timeout-minutes: 60
        continue-on-error: true
        env:
          # The built-in token cannot search ror-community/ror-updates.
          GITHUB_TOKEN: ${{ secrets.CURATION_TOKEN || secrets.GITHUB_TOKEN }}
          # Unquoted below on purpose -- the list has to word-split into
          # separate arguments. Values come from the sed above, so they are
          # [0-9a-z] suffixes and nothing else.
          SUFFIXES: ${{ steps.changed.outputs.suffixes }}
        run: python scripts/update_curation.py --seed --only $SUFFIXES

      # Runs only when the seed above actually failed (a skipped step reports
      # outcome "skipped", not "failure"). Writes both to the run summary and to
      # a file the PR body picks up, so the warning reaches whoever merges.
      - name: Flag missing curation links
        if: steps.curation.outcome == 'failure'
        env:
          SUFFIXES: ${{ steps.changed.outputs.suffixes }}
        run: |
          set -euo pipefail
          {
            echo "> [!WARNING]"
            echo "> Curation linking failed for this dump (\`$SUFFIXES\`) --"
            echo "> check the *Link ROR curation requests* step, and whether"
            echo "> \`CURATION_TOKEN\` is still valid. The data below is unaffected;"
            echo "> the weekly reseed will retry."
          } > /tmp/curation-warning.md
          cat /tmp/curation-warning.md >> "$GITHUB_STEP_SUMMARY"

      # The API key reaches the script through the environment only -- never
      # through the run: source (which would put it in the workflow's own text
      # and thus in the logs) and never through a command-line argument.
      #
      # A missing key warns and continues: OpenAlex permits anonymous access at
      # a tenth of the keyed daily allowance, and this sweep needs about seven
      # institution-list requests (305 records / 50 per filter), so anonymous
      # access covers it comfortably. Losing the whole ROR refresh over an
      # unconfigured secret would cost more than it protects -- but the warning
      # and the run summary make a broken secret impossible to miss.
      #
      # A key that is present but rejected is *not* retried anonymously: the
      # request fails and the step fails with it, as does a rate-limited
      # anonymous run. Either way the script raises before it writes anything
      # (every batch is fetched first), so the data never lands half-updated.
      # `mailto` is sent regardless, key or not.
      - name: Update OpenAlex companion data
        if: steps.preflight.outputs.fresh != 'true'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -euo pipefail
          # Whitespace is stripped before the emptiness test so that the check
          # and the script agree: update_openalex.py strips the value too, and
          # a secret of blanks would otherwise count as configured here while
          # the script went anonymous anyway. Copied into a local first so that
          # an entirely unset variable fails the test rather than `set -u`.
          key="${OPENALEX_API_KEY:-}"
          if [ -z "${key//[[:space:]]/}" ]; then
            echo "::warning title=OpenAlex API key missing::Falling back to anonymous access with a lower allowance."
            {
              echo "### ⚠ OpenAlex API key missing"
              echo
              echo "The refresh used anonymous access. Configure the"
              echo "\`OPENALEX_API_KEY\` repository secret for the larger allowance."
            } >> "$GITHUB_STEP_SUMMARY"
            # Blanks must not reach the script as a "configured" key.
            unset OPENALEX_API_KEY
          fi

          python scripts/update_openalex.py \
            --mailto "${{ github.event.inputs.mailto || 'openalex@slub-dresden.de' }}"

      - name: Summarize changes
        id: diff
        if: steps.preflight.outputs.fresh != 'true'
        run: |
          # Stage everything first -- new record files are untracked at this
          # point, and plain `git diff` is blind to untracked files entirely
          # (they don't count as "added", they don't count as anything).
          # Staging first and diffing --cached from here on is what makes the
          # added/removed/modified counts below actually correct.
          git add -A -- data

          if git diff --cached --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Curation links can change on this path too now, so the PR has to
          # say so -- via the same curation-update label the weekly reseed
          # uses, so that filtering on the label finds every PR that touched a
          # link rather than only curation-seed.yml's.
          if git diff --cached --quiet -- data/curation.json; then
            curation=false
          else
            curation=true
          fi
          echo "curation=$curation" >> "$GITHUB_OUTPUT"

          # Per-record file adds/removals/modifications for the PR body.
          added=$(git diff --cached --diff-filter=A --name-only -- data/records | wc -l | tr -d ' ')
          removed=$(git diff --cached --diff-filter=D --name-only -- data/records | wc -l | tr -d ' ')
          modified=$(git diff --cached --diff-filter=M --name-only -- data/records | wc -l | tr -d ' ')
          version=$(python -c "import json; print(json.load(open('data/meta.json'))['ror']['dump_version'])")
          count=$(python -c "import json; print(json.load(open('data/meta.json'))['ror']['record_count'])")
          # Real Zenodo creation moment of this dump -- used as the commit's
          # author date so `git log` reads as a true Zenodo timeline.
          created=$(python -c "import json; print(json.load(open('data/meta.json'))['ror']['zenodo_created'])")

          {
            echo "version=$version"
            echo "count=$count"
            echo "added=$added"
            echo "removed=$removed"
            echo "modified=$modified"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"

          {
            echo "Automated refresh from ROR dump **$version** — $count Saxon records."
            echo ""
            echo "| Change | Records |"
            echo "| --- | --- |"
            echo "| Added | $added |"
            echo "| Removed | $removed |"
            echo "| Modified | $modified |"
            echo ""
            if [ "$added" -gt 0 ]; then
              echo "**Added:**"
              git diff --cached --diff-filter=A --name-only -- data/records | sed 's#data/records/#- \`#; s#\.json#\`#'
              echo ""
            fi
            if [ "$removed" -gt 0 ]; then
              echo "**Removed:**"
              git diff --cached --diff-filter=D --name-only -- data/records | sed 's#data/records/#- \`#; s#\.json#\`#'
              echo ""
            fi
            # Links the seed just added, read straight out of the staged diff
            # against main -- no before/after snapshot to keep in sync.
            if [ "$curation" = "true" ]; then
              echo "**Curation links:**"
              python3 - <<'PY'
          import json, subprocess, sys

          # Repo name from the script, so it cannot drift out of the workflows.
          sys.path.insert(0, "scripts")
          from update_curation import CURATION_REPO

          show = subprocess.run(
              ["git", "show", "HEAD:data/curation.json"],
              capture_output=True, text=True,
          )
          # No file at HEAD (first run) just means every link is new.
          before = json.loads(show.stdout) if show.returncode == 0 else {}
          after = json.load(open("data/curation.json"))
          for sfx, nums in sorted(after.items()):
              new = sorted(set(nums) - set(before.get(sfx, [])), reverse=True)
              if new:
                  # Not "#123", which resolves against *this* repo. Not
                  # owner/repo#123 or a plain github.com URL either: every
                  # reference generates a backlink, and we would be filing one
                  # on an upstream issue we do not own on every dump.
                  # redirect.github.com is GitHub's documented opt-out -- it
                  # costs the hover preview, which is a fair trade for not
                  # spamming ROR's tracker.
                  links = ", ".join(
                      f"[#{n}](https://redirect.github.com/{CURATION_REPO}/issues/{n})"
                      for n in new
                  )
                  print(f"- `{sfx}`: {links}")
          PY
              echo ""
            fi
            # Present only when the curation seed failed. Written with `if`
            # rather than `[ -f ] && cat` so a missing file (the normal case)
            # cannot end this group on a non-zero status and fail the step.
            if [ -f /tmp/curation-warning.md ]; then
              cat /tmp/curation-warning.md
            fi
          } > /tmp/pr-body.md

      # Commit ourselves (rather than an action) so the commit's author date can
      # be set to the dump's real Zenodo creation moment. Landing the PR with
      # GitHub's "Rebase and merge" preserves that author date on main; the
      # committer date becomes the merge time, which is acceptable.
      - name: Open data-update pull request
        if: steps.preflight.outputs.fresh != 'true' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_DATE: ${{ steps.diff.outputs.created }}
          GIT_COMMITTER_DATE: ${{ steps.diff.outputs.created }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="automated/data-update"
          git switch -c "$branch"
          git commit -m "data: update to ROR dump ${{ steps.diff.outputs.version }} (${{ steps.diff.outputs.count }} Saxon records)"
          git push --force origin "$branch"

          # Ensure the tracking labels exist, then open the PR if none is open.
          # curation-update is added only when this run actually changed a link,
          # and carries curation-seed.yml's colour so the two agree.
          gh label create data-update --color 0e8a16 --force >/dev/null 2>&1 || true
          labels="data-update"
          if [ "${{ steps.diff.outputs.curation }}" = "true" ]; then
            gh label create curation-update --color 5319e7 --force >/dev/null 2>&1 || true
            labels="$labels,curation-update"
          fi

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main --head "$branch" \
              --title "data: update to ROR dump ${{ steps.diff.outputs.version }}" \
              --body-file /tmp/pr-body.md \
              --label "$labels"
          else
            # --add-label, not --label: a re-run that finds a link must not
            # strip labels a previous run (or a human) already put on the PR.
            gh pr edit "$branch" --body-file /tmp/pr-body.md --add-label "$labels"
          fi
