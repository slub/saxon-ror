name: Reseed ROR curation links

# Periodically re-runs scripts/update_curation.py --seed against
# ror-community/ror-updates to catch newly-closed curation issues. This
# matters most for "add new organization" requests: they only become
# linkable once an "Assigned ROR ID ... in release vX.Y" comment is posted
# (by a curator or by ror-curator-bot -- the seed matches the phrase, not the
# author), and that comment can lag well behind the record actually
# appearing in a published ROR dump (observed first-hand around v2.10, where
# the milestone stayed open for weeks after release). Opens a PR only when
# the seed actually finds something new; most runs are a no-op.

on:
  schedule:
    # Mondays 04:30 UTC, ahead of pages.yml's 05:00 UTC weekly enrich run.
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Snapshot current curation map
        run: cp data/curation.json /tmp/curation-before.json

      # The built-in GITHUB_TOKEN is an installation token scoped to this
      # repository, so the GitHub *search* API returns nothing for
      # ror-community/ror-updates (plain issue reads still work). Hence
      # CURATION_TOKEN: a PAT that can read public repos, holding no write
      # permission here -- the steps below keep using GITHUB_TOKEN for that.
      # Without the secret (forks) update_curation.py detects the empty search
      # and falls back to unauthenticated, which is slower -- hence the timeout.
      - name: Reseed curation links
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.CURATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/update_curation.py --seed

      - name: Summarize changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- data/curation.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new curation links found."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          python3 - <<'PY' > /tmp/pr-body.md
          import json, sys

          # Repo name from the script, so it cannot drift out of the workflows.
          sys.path.insert(0, "scripts")
          from update_curation import CURATION_REPO

          before = json.load(open("/tmp/curation-before.json"))
          after = json.load(open("data/curation.json"))

          def links(numbers):
              """Render issue numbers as explicit, backlink-free links.

              A bare "#123" resolves against *this* repo, not the curation repo.
              owner/repo#123 and a plain github.com URL both resolve correctly
              but generate a backlink, which would file a cross-reference on an
              upstream issue we do not own every time this runs.
              redirect.github.com is GitHub's documented opt-out; the cost is
              the hover preview.
              """
              return ", ".join(
                  f"[#{n}](https://redirect.github.com/{CURATION_REPO}/issues/{n})"
                  for n in numbers
              )

          added = sorted(set(after) - set(before))
          updated = sorted(
              sfx for sfx in (set(after) & set(before))
              if sorted(after[sfx]) != sorted(before[sfx])
          )

          print(
              "Automated re-seed from `ror-community/ror-updates` -- picks up "
              "curation issues that were closed (and got their `Assigned ROR ID` "
              "assignment comment) since the last seed run."
          )
          print()
          if added:
              print(f"**New records linked ({len(added)}):**")
              for sfx in added:
                  print(f"- `{sfx}`: {links(after[sfx])}")
              print()
          if updated:
              print(f"**Records with additional issues linked ({len(updated)}):**")
              for sfx in updated:
                  print(f"- `{sfx}`: {links(after[sfx])}")
          PY

      - name: Open curation-update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="automated/curation-reseed"
          git switch -c "$branch"
          git add data/curation.json
          git commit -m "curation: reseed ROR curation links"
          git push --force origin "$branch"

          gh label create curation-update --color 5319e7 --force >/dev/null 2>&1 || true
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main --head "$branch" \
              --title "curation: reseed ROR curation links" \
              --body-file /tmp/pr-body.md \
              --label curation-update
          else
            gh pr edit "$branch" --body-file /tmp/pr-body.md
          fi
